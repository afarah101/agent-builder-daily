name: preview-images

# Manual only. Builds a preview of the page WITH AI images on branch preview/ai-images.
# PREVIEW ONLY: never merge preview/ai-images. Delete the branch after review.
on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}  # the branch the run was started on

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate AI images
        env:
          IMAGE_GEN_ENABLED: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          PYTHONIOENCODING: utf-8
        run: |
          python generate_images.py

      - name: Generate page
        env:
          PYTHONIOENCODING: utf-8
        run: python generate_html.py

      - name: List generated images (slug, KB, neurons)
        run: |
          python - <<'EOF'
          import json, pathlib
          d = pathlib.Path("site/images")
          alts = json.loads((d / "alt.json").read_text()) if (d / "alt.json").exists() else {}
          files = sorted(d.glob("*.webp"))
          print(f"{len(files)} image(s)")
          for f in files:
              print(f"IMAGE {f.stem} | {f.stat().st_size / 1024:.1f} KB | neurons {alts.get(f.stem, {}).get('neurons', 'unknown')}")
          EOF

      - name: Push preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B preview/ai-images
          git add site/images/ site/index.html
          git commit -m "PREVIEW ONLY - do not merge" || echo "nothing to commit"
          git push --force origin preview/ai-images
