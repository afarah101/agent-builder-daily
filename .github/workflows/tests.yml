name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Code paths only, so the bot's data-only commits do not start this run.
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'tests/**'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -q tests
