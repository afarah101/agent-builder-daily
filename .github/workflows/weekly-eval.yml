name: Weekly Agent Check

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  weekly-eval:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Standard library only: no pip install needed.
      - name: Send weekly Langfuse evaluation email
        env:
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_BASE_URL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_AS_PUBLIC_KEY: ${{ secrets.LANGFUSE_AS_PUBLIC_KEY }}
          LANGFUSE_AS_SECRET_KEY: ${{ secrets.LANGFUSE_AS_SECRET_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          PYTHONIOENCODING: utf-8
        run: python weekly_eval_report.py
