<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scout — AI Intelligence Feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2d3148;
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-green: #22c55e;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Header */
    .header {
      border-bottom: 1px solid var(--border);
      padding: 32px 0 0;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 32px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand { display: flex; align-items: center; gap: 0; }

    .brand-name {
      font-family: 'Syne', sans-serif;
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      background: linear-gradient(135deg, #ffffff 0%, #00ff88 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-cursor {
      display: inline-block;
      width: 10px;
      height: 40px;
      background: #00ff88;
      margin-left: 4px;
      vertical-align: middle;
      animation: blink 1s infinite;
      border-radius: 2px;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-green);
      border-radius: 50%;
      animation: blink 2s infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .header-stats { display: flex; gap: 32px; }

    .stat { text-align: right; }

    .stat-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      font-weight: 600;
      color: var(--accent-green);
      line-height: 1;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .updated {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    /* Tabs */
    .tabs { display: flex; gap: 0; }

    .tab {
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border: none;
      background: none;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }

    /* Content */
    .content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 32px 64px;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(540px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent)22;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .card-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    .tag-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }

    .tier-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .source-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .built-badge {
      font-size: 11px;
      color: var(--accent-green);
      background: #22c55e1a;
      padding: 3px 8px;
      border-radius: 20px;
    }

    /* Score ring */
    .score-ring {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: conic-gradient(var(--color) calc(var(--pct) * 1%), var(--surface2) 0);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
    }

    .score-ring::before {
      content: '';
      position: absolute;
      width: 34px;
      height: 34px;
      background: var(--surface);
      border-radius: 50%;
    }

    .score-ring span {
      position: relative;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      z-index: 1;
    }

    /* News score */
    .news-score-area { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .rel-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .score-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    /* Card content */
    .card-title {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text);
      margin-bottom: 8px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .authors { font-size: 13px; color: var(--accent); font-weight: 500; }
    .institution { font-size: 13px; color: var(--text-secondary); }
    .pub-date { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); }
    .sep { color: var(--border); }

    .card-summary {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .insight-block {
      background: var(--surface2);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 10px;
      border-left: 3px solid var(--accent);
    }

    .insight-block.monetisation { border-left-color: var(--accent-green); }

    .insight-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .monetisation .insight-label { color: var(--accent-green); }

    .insight-text {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text);
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .score-pills { display: flex; gap: 6px; flex-wrap: wrap; }

    .score-pills span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
      background: var(--bg);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .read-link {
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      white-space: nowrap;
    }

    /* Archive */
    .archive-list { display: flex; flex-direction: column; gap: 8px; }

    .archive-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 20px;
      display: grid;
      grid-template-columns: 110px 80px 1fr;
      gap: 20px;
      align-items: start;
    }

    .archive-date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--accent-green);
    }

    .archive-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
    }

    .archive-previews { display: flex; flex-direction: column; gap: 4px; }

    .archive-title {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      text-align: center;
      padding: 64px 32px;
      color: var(--text-muted);
      font-size: 14px;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 20px 32px;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    footer span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
    }

    @media (max-width: 700px) {
      .cards-grid { grid-template-columns: 1fr; }
      .header-inner { padding: 0 16px; }
      .content { padding: 24px 16px 48px; }
      .archive-row { grid-template-columns: 1fr; gap: 6px; }
      .header-top { flex-direction: column; align-items: flex-start; }
      .header-stats { flex-direction: row; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-top">
      <div class="brand">
        <span class="brand-name">Scout Daily</span><span class="brand-cursor"></span>
      </div>
      <div class="header-stats">
        <div class="stat">
          <div class="stat-num">0</div>
          <div class="stat-label">Case Studies</div>
        </div>
        <div class="stat">
          <div class="stat-num">0</div>
          <div class="stat-label">News Items</div>
        </div>
      </div>
    </div>
    <div class="updated">Updated 28 Apr 2026, 23:30</div>
    <div class="tabs">
      <button class="tab active" onclick="showTab('case-studies',this)">Case Studies</button>
      <button class="tab" onclick="showTab('industry-news',this)">Industry News</button>
      <button class="tab" onclick="showTab('archive-cs',this)">Archive: Studies</button>
      <button class="tab" onclick="showTab('archive-news',this)">Archive: News</button>
    </div>
  </div>
</div>

<div class="content">
  <div id="case-studies" class="panel active">
    <div class="cards-grid"><div class='empty-state'><p>No case studies available yet.</p></div></div>
  </div>

  <div id="industry-news" class="panel">
    <div class="cards-grid"><div class='empty-state'><p>No news available yet.</p></div></div>
  </div>

  <div id="archive-cs" class="panel">
    <div class="archive-list"><div class="archive-row">
  <div class="archive-date">2026-04-28</div>
  <div class="archive-count">0 items</div>
  <div class="archive-previews"></div>
</div></div>
  </div>

  <div id="archive-news" class="panel">
    <div class="archive-list"><div class="archive-row">
  <div class="archive-date">2026-04-28</div>
  <div class="archive-count">0 items</div>
  <div class="archive-previews"></div>
</div></div>
  </div>
</div>

<footer>
  <span>Scout · LangGraph + Groq + arXiv</span>
  <span>Case Studies: last 4 months · News: last 4–8 weeks</span>
</footer>

<script>
  function showTab(id, btn) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
  }
</script>
</body>
</html>
